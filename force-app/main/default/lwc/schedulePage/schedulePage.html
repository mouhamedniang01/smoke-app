<template>
    <div class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-card__header-text">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-event"></span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Programmation du Projet : {projectName}</span>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-p-around_medium">
            <!-- Centralized Scheduling Parameters -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                    <p class="slds-text-heading_small">Configuration de l'exécution</p>
                </div>
                
                <!-- Schedule Creator Component -->
                <div class="slds-col slds-size_1-of-1">
                    <c-schedule-creator-component 
                        project-id={projectId} 
                        disabled={isMappingComplete}>
                    </c-schedule-creator-component>
                </div>
            </div>

            <div class="slds-m-top_large">
                <p class="slds-text-heading_small slds-m-bottom_small">Jobs Programmés</p>
                <c-schedule-jobs-component project-id={projectId}></c-schedule-jobs-component>
            </div>
        </div>
    </div>
</template>
